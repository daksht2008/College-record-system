<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">
    <title>Login | EduSync - College Records</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduSync">
</head>
<body>
    <div class="center-wrapper">
        <div class="glass-card login-box">
            <h2>Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Sign in with your ID — we'll figure out who you are.</p>
            <div id="loginAlert" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="userId" class="form-control" placeholder="Enrollment No / Roll No / Admin Username" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <input type="checkbox" id="loginRememberMe" style="width: auto; transform: scale(1.1);">
                        <label for="loginRememberMe" style="margin: 0; font-size: 0.95rem; color: var(--text-muted);">Remember me</label>
                    </div>
                    <a href="#" onclick="showForgotPasswordModal(); return false;" style="color: var(--primary); font-size: 0.9rem; text-decoration: none;">Forgot Password?</a>
                </div>

                <!-- Division selector — hidden by default, only shown when multiple matches -->
                <div class="form-group" id="divisionGroup" style="display: none;">
                    <label>Select Your Division</label>
                    <select id="loginDivision" class="form-control">
                    </select>
                </div>
                
                <button type="submit" class="btn" id="loginBtn">Sign In</button>
                <div id="installContainer" style="display: none; margin-top: 1rem; text-align: center;">
                    <p id="installPromptText" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.75rem;">Install EduSync on your device for quick access.</p>
                    <button type="button" class="btn" id="installAppBtn" style="background: #10b981;">Install EduSync App</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1100; justify-content: center; align-items: center;">
        <div class="glass-card" style="width: 90%; max-width: 400px; position: relative;">
            <button onclick="document.getElementById('forgotPasswordModal').style.display='none'" style="position: absolute; right: 1rem; top: 1rem; background: transparent; color: white; font-size: 1.5rem; border: none; cursor: pointer;">&times;</button>
            <h3 style="margin-bottom: 0.5rem;">Reset Password</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Enter your Enrollment No or Roll No. We will send your password to your registered email.</p>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="forgotPasswordId" class="form-control" placeholder="Enrollment No / Roll No" required>
                </div>
                <button type="submit" class="btn">Send Password</button>
                <div id="forgotPasswordAlert" class="alert" style="margin-top: 1rem; display: none;"></div>
            </form>
        </div>
    </div>

    <script src="offline-sync.js"></script>
    <script src="app.js"></script>
    <script>
        window.addEventListener('load', () => {
            // Register Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('✅ Service Worker registered:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            }
            // Setup PWA Install Prompt
            if (typeof setupInstallPrompt === 'function') {
                setupInstallPrompt();
            }
        });
    </script>
</body>
</html>
