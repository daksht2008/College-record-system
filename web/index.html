<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c0a09">
    <title>Login | EduSync - College Records</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduSync">
</head>
<body>
    <div class="center-wrapper">
        <div class="glass-card login-box">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, rgba(244,63,94,0.15), rgba(251,146,60,0.15)); border: 1px solid rgba(244,63,94,0.2); margin-bottom: 1rem; animation: float 4s ease-in-out infinite;">
                    <span style="font-size: 1.8rem;">&#x1F393;</span>
                </div>
                <h2>Welcome Back</h2>
                <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.5rem;">Sign in with your credentials to continue</p>
            </div>
            <div id="loginAlert" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="userId" class="form-control" placeholder="Enrollment No / Roll No / Admin Username" required>
                </div>
                
                <div class="form-group" style="position: relative;">
                    <label>Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="text" id="password" class="form-control" placeholder="Enter password" required style="padding-right: 2.75rem;">
                        <button type="button" id="togglePasswordVisibilityBtn" onclick="togglePasswordVisibility()" style="position: absolute; right: 0.75rem; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; display: flex; align-items: center; justify-content: center; z-index: 5; padding: 0;">
                            👁️
                        </button>
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <input type="checkbox" id="loginRememberMe" style="width: auto; transform: scale(1.1); accent-color: var(--primary);">
                        <label for="loginRememberMe" style="margin: 0; font-size: 0.9rem; color: var(--text-muted); text-transform: none; letter-spacing: 0;">Remember me</label>
                    </div>
                    <a href="#" onclick="showForgotPasswordModal(); return false;" style="color: var(--primary); font-size: 0.85rem; text-decoration: none; font-weight: 500; transition: color 0.3s;">Forgot Password?</a>
                </div>

                <!-- Division selector — hidden by default -->
                <div class="form-group" id="divisionGroup" style="display: none;">
                    <label>Select Your Division</label>
                    <select id="loginDivision" class="form-control">
                    </select>
                </div>
                
                <button type="submit" class="btn" id="loginBtn">Sign In</button>
                
                <div style="display: flex; align-items: center; gap: 1rem; margin: 1rem 0;">
                    <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.06);"></div>
                    <span style="color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;">or</span>
                    <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.06);"></div>
                </div>
                
                <button type="button" class="btn" id="faceLoginBtn" onclick="openFaceLoginModal()" style="background: linear-gradient(135deg, #f43f5e 0%, #fb923c 50%, #f43f5e 100%); background-size: 200% 200%; animation: shimmer 3s linear infinite; border: 1px solid rgba(244,63,94,0.3);">
                    &#x1F510; Face ID Login
                </button>
                <div id="installContainer" style="display: none; margin-top: 1rem; text-align: center;">
                    <p id="installPromptText" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem;">Install EduSync on your device for quick access.</p>
                    <button type="button" class="btn" id="installAppBtn">Install EduSync App</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1100; justify-content: center; align-items: center; backdrop-filter: blur(6px);">
        <div class="glass-card" style="width: 90%; max-width: 400px; position: relative; border: 1px solid rgba(251,146,60,0.15);">
            <button onclick="document.getElementById('forgotPasswordModal').style.display='none'" style="position: absolute; right: 1rem; top: 1rem; background: rgba(255,255,255,0.05); color: #a8a29e; font-size: 1.2rem; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">&times;</button>
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.2); margin-bottom: 0.75rem;">
                <span style="font-size: 1.2rem;">&#x1F511;</span>
            </div>
            <h3 style="margin-bottom: 0.25rem; background: linear-gradient(135deg, #fed7aa, #fb923c); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Reset Password</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">We'll send your password to your registered email.</p>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="forgotPasswordId" class="form-control" placeholder="Enrollment No / Roll No" required>
                </div>
                <button type="submit" class="btn" style="background: linear-gradient(135deg, #fb923c, #ea580c);">Send Password</button>
                <div id="forgotPasswordAlert" class="alert" style="margin-top: 1rem; display: none;"></div>
            </form>
        </div>
    </div>

    <!-- Face Login Modal -->
    <div id="faceLoginModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 1200; justify-content: center; align-items: center; backdrop-filter: blur(8px);">
        <div class="glass-card" style="width: 95%; max-width: 520px; position: relative; text-align: center; border: 1px solid rgba(244, 63, 94, 0.15); box-shadow: 0 0 60px rgba(244, 63, 94, 0.08), 0 0 120px rgba(251, 146, 60, 0.04);">
            <button onclick="closeFaceLoginModal()" style="position: absolute; right: 1rem; top: 1rem; background: rgba(255,255,255,0.05); color: #a8a29e; font-size: 1.2rem; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.3s;">&times;</button>
            
            <div style="margin-bottom: 1rem;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, rgba(244,63,94,0.15), rgba(251,146,60,0.15)); border: 1px solid rgba(244,63,94,0.2); margin-bottom: 0.75rem; animation: float 3s ease-in-out infinite;">
                    <span style="font-size: 1.4rem;">&#x1F510;</span>
                </div>
                <h3 style="font-size: 1.3rem; margin-bottom: 0.25rem; background: linear-gradient(135deg, #fecdd3, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Face ID Authentication</h3>
                <p id="faceLoginStatus" style="color: var(--text-muted); font-size: 0.85rem;">Loading neural network models...</p>
            </div>
            
            <div style="position: relative; display: inline-block; border-radius: 16px; overflow: hidden; border: 2px solid rgba(244, 63, 94, 0.25); box-shadow: 0 0 30px rgba(244,63,94,0.08); animation: borderGlow 3s ease-in-out infinite;">
                <video id="faceLoginVideo" autoplay muted playsinline style="width: 100%; max-width: 440px; border-radius: 14px; transform: scaleX(-1); display: block;"></video>
                <canvas id="faceLoginCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1);"></canvas>
                <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; border-radius: 14px; box-shadow: inset 0 0 60px rgba(244,63,94,0.08);"></div>
            </div>
            
            <div style="margin-top: 1.25rem;">
                <button type="button" class="btn" id="faceLoginScanBtn" onclick="attemptFaceLogin()" style="background: linear-gradient(135deg, #f43f5e 0%, #fb923c 50%, #f43f5e 100%); background-size: 200% 200%; animation: shimmer 3s linear infinite; border: 1px solid rgba(244,63,94,0.3); max-width: 280px;" disabled>&#x26A1; Scan &amp; Authenticate</button>
            </div>
            <div id="faceLoginAlert" class="alert" style="margin-top: 1rem; display: none;"></div>
        </div>
    </div>

    <script src="face-api.min.js"></script>
    <script src="offline-sync.js"></script>
    <script src="app.js"></script>
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePasswordVisibilityBtn');
            if (passwordInput.type === 'text') {
                passwordInput.type = 'password';
                toggleBtn.innerText = '🙈';
            } else {
                passwordInput.type = 'text';
                toggleBtn.innerText = '👁️';
            }
        }

        window.addEventListener('load', () => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            }
            if (typeof setupInstallPrompt === 'function') {
                setupInstallPrompt();
            }
        });
    </script>
</body>
</html>
